# Full stack: SQL Server + API (migrations and seed on startup) + Next.js frontend.
# Start:  docker compose up --build
# Traces: docker compose --profile observability up --build   (adds Jaeger on http://localhost:16686)
# Values come from .env (see .env.example).

name: mundialito

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: ${DB_MEMORY_LIMIT_MB:-2048}
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Server=db,1433;Database=Mundialito;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedOnStartup: "true"
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-3800}"
      OpenTelemetry__OtlpEndpoint: "http://jaeger:4317"
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle: the browser calls the API through the host-published port.
        NEXT_PUBLIC_API_URL: "http://localhost:${API_PORT:-5000}"
    ports:
      - "${FRONTEND_PORT:-3800}:3800"
    depends_on:
      api:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    ports:
      - "16686:16686"

volumes:
  mssql-data:
